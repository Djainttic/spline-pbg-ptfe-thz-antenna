name: Manuscript audit

on:
  push:
    branches: [manuscript-master]
  pull_request:
    branches: [manuscript-master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-manuscripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Audit figures, bibliographies, citations, and placeholders
        run: python3 scripts/audit_manuscripts.py
